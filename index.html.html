body[data-theme=synth]{

body[data-theme=sakura]{
  --page-bg:linear-gradient(160deg,#fff1f5 0%,#ffd9e6 55%,#ffc2d4 100%);--app-bg:rgba(255,255,255,.62);--solid-bg:#fff5f8;--panel-2:rgba(190,60,110,.07);--solid:rgba(255,255,255,.92);
  --text:#3b1a2a;--dim:#9a6b80;--line:rgba(190,60,110,.14);--accent:#e8457c;--accent-2:#ff8fab;--on-accent:#fff;--on-grad:#fff;
  --grad:linear-gradient(135deg,#ff6b9d 0%,#e8457c 100%);
  --out-bg:linear-gradient(135deg,#ff7aa5,#e23f78);--out-text:#fff;--in-bg:rgba(255,255,255,.82);--in-text:#3b1a2a;--in-border:1px solid rgba(190,60,110,.1);
  --sh-1:0 12px 40px rgba(190,60,110,.18);--sh-2:0 4px 14px rgba(190,60,110,.12);--sh-in:inset 0 0 0 1px rgba(190,60,110,.12);
  --bub-sh:0 2px 10px rgba(190,60,110,.12);--glow:0 0 22px rgba(232,69,124,.35);--blur:blur(18px) saturate(160%);
  --sel:linear-gradient(90deg,rgba(255,107,157,.14),rgba(255,143,171,.12));--sel-sh:inset 0 0 0 1px rgba(190,60,110,.14);
  --blob1:#ff8fab;--blob2:#ffc2d4;--blob3:#ffb86b;--blob-o:.55;--sun-o:0;--noise:none;--dots:rgba(190,60,110,.08);
  --wv-me-on:#fff;--wv-me-off:rgba(255,255,255,.55);--wv-th-on:#e8457c;--wv-th-off:rgba(59,26,42,.25);
}
body[data-theme=gold]{
  --page-bg:radial-gradient(circle at 25% 15%,#1b1a2e,#07070d 70%);--app-bg:rgba(14,13,24,.68);--solid-bg:#0d0c18;--panel-2:rgba(255,215,130,.06);--solid:rgba(24,22,38,.9);
  --text:#f6efe0;--dim:#a59c85;--line:rgba(240,190,90,.16);--accent:#f2b84b;--accent-2:#ffdf9c;--on-accent:#1c1303;--on-grad:#1c1303;
  --grad:linear-gradient(135deg,#ffd77a 0%,#e8a31e 100%);
  --out-bg:linear-gradient(135deg,#d9972a,#a96d10);--out-text:#fff9ea;--in-bg:rgba(255,255,255,.06);--in-text:#f6efe0;--in-border:1px solid rgba(240,190,90,.1);
  --sh-1:0 12px 40px rgba(0,0,0,.55);--sh-2:0 4px 14px rgba(0,0,0,.35);--sh-in:inset 0 0 0 1px rgba(240,190,90,.14);
  --bub-sh:0 2px 10px rgba(0,0,0,.25);--glow:0 0 22px rgba(242,184,75,.4);--blur:blur(18px) saturate(140%);
  --sel:linear-gradient(90deg,rgba(242,184,75,.14),rgba(255,223,156,.08));--sel-sh:inset 0 0 0 1px rgba(240,190,90,.2);
  --blob1:#f2b84b;--blob2:#3b2f8f;--blob3:#b45309;--blob-o:.3;--sun-o:0;--noise:none;--dots:rgba(240,190,90,.06);
  --wv-me-on:#fff;--wv-me-off:rgba(255,255,255,.45);--wv-th-on:#f2b84b;--wv-th-off:rgba(255,255,255,.28);
}
/* ============ BASE ============ */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font);background:var(--page-bg);color:var(--text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
input,textarea{font:inherit;color:inherit;border:0;outline:0;background:none}
mark{background:var(--accent);color:var(--on-accent);border-radius:4px;padding:0 2px}
.i{width:22px;height:22px;flex:none;display:block}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-old(root){z-index:1}::view-transition-new(root){z-index:2}
/* ============ BACKDROP ============ */
#bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--page-bg)}
#bg>i{position:absolute;border-radius:50%;opacity:var(--blob-o);will-change:transform}
.b1{width:64vmax;height:64vmax;left:-20vmax;top:-24vmax;background:radial-gradient(circle,var(--blob1),transparent 66%);animation:drift 26s ease-in-out infinite alternate}
.b2{width:60vmax;height:60vmax;right:-18vmax;bottom:-24vmax;background:radial-gradient(circle,var(--blob2),transparent 66%);animation:drift 32s ease-in-out infinite alternate-reverse}
.b3{width:44vmax;height:44vmax;left:35%;top:30%;background:radial-gradient(circle,var(--blob3),transparent 66%);animation:drift 38s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(9vmax,7vmax,0) scale(1.15)}}
.sun{position:absolute;left:50%;bottom:16vh;width:46vmin;height:46vmin;margin-left:-23vmin;border-radius:50%;opacity:var(--sun-o);
  background:linear-gradient(180deg,#ffe066 0%,#ff9a3c 35%,#ff2e93 72%,#b517b8 100%);
  -webkit-mask-image:repeating-linear-gradient(180deg,#000 0,#000 9%,transparent 9%,transparent 11%);mask-image:repeating-linear-gradient(180deg,#000 0,#000 9%,transparent 9%,transparent 11%);
  box-shadow:0 0 80px rgba(255,60,160,.5)}
.gridw{position:absolute;left:0;right:0;bottom:0;height:34vh;overflow:hidden;perspective:340px;opacity:var(--sun-o);border-top:2px solid rgba(255,80,200,.7)}
.grid{position:absolute;left:-50%;width:200%;height:220%;top:0;transform:rotateX(64deg);transform-origin:50% 0;
  background-image:linear-gradient(rgba(255,60,190,.8) 2px,transparent 2px),linear-gradient(90deg,rgba(255,60,190,.8) 2px,transparent 2px);background-size:64px 64px;
  animation:gridmove 1.6s linear infinite;-webkit-mask-image:linear-gradient(#000,transparent 85%);mask-image:linear-gradient(#000,transparent 85%)}
@keyframes gridmove{to{transform:rotateX(64deg) translateY(64px)}}
/* ============ DOCK ============ */
#dock{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:200;display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:999px;
  background:var(--solid);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:var(--sh-1),0 0 0 1px var(--line);height:46px}
.seg{position:relative;display:flex;border-radius:999px;background:var(--panel-2);box-shadow:var(--sh-in);padding:3px;height:36px}
.seg button{position:relative;z-index:1;display:flex;align-items:center;gap:6px;padding:0 13px;border-radius:999px;font-size:13px;color:var(--dim);transition:color .3s}
.seg button .i{width:17px;height:17px}
.seg button.on{color:var(--on-accent)}
.seg-ind{position:absolute;top:3px;bottom:3px;left:0;border-radius:999px;background:var(--accent);box-shadow:var(--glow);transition:transform .5s var(--spring),width .5s var(--spring)}
.sep{width:1px;height:22px;background:var(--line)}
.themes{display:flex;gap:8px;align-items:center}
.td{width:28px;height:28px;border-radius:50%;position:relative;box-shadow:0 0 0 1px var(--line);transition:transform .4s var(--spring),box-shadow .3s}
.td:hover{transform:scale(1.18)}
.td.on{box-shadow:0 0 0 2px var(--solid),0 0 0 4px var(--accent)}
.td:active{transform:scale(.9)}
#themeName{font-size:12.5px;color:var(--dim);min-width:108px;text-align:start}
.dbtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--dim);background:var(--panel-2);box-shadow:var(--sh-2);transition:color .3s,transform .3s var(--spring)}
.dbtn:hover{color:var(--accent)}.dbtn:active{transform:scale(.88)}
body.native #dock{display:none}
@media (max-width:820px){#themeName{display:none}.seg button span{display:none}.seg button{padding:0 11px}}
/* ============ STAGE / DEVICE ============ */
#stage{position:fixed;left:0;top:0;width:100%;height:100vh;height:var(--vvh,100dvh);display:grid;place-items:center;padding:66px 14px 14px}
body.native #stage{padding:0}
#device{position:relative;width:100%;height:100%;max-width:1640px}
body[data-device=desktop] #device,body.native #device{border-radius:26px;box-shadow:0 30px 80px rgba(0,0,0,.4),0 0 0 1px var(--line)}
body.native #device{border-radius:0;box-shadow:none;max-width:none}
body:not(.native)[data-device=iphone] #device,body:not(.native)[data-device=android] #device{
  --ph:max(540px,min(870px,calc(100dvh - 92px)));height:var(--ph);width:calc(var(--ph)*393/852);max-width:100%;box-shadow:none}
body:not(.native)[data-device=iphone] #device{--bezel:11px;--dev-r:58px;border-radius:58px;
  background:linear-gradient(145deg,#2c2d35,#0a0a0e);
  box-shadow:inset 0 0 0 2px #40414b,inset 0 0 0 5px #000,0 40px 90px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.08)}
body:not(.native)[data-device=android] #device{--bezel:8px;--dev-r:38px;border-radius:38px;
  background:linear-gradient(145deg,#33343c,#101014);
  box-shadow:inset 0 0 0 2px #3c3d46,inset 0 0 0 4px #000,0 40px 90px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.08)}
body:not(.native)[data-device=iphone] #device::before,body:not(.native)[data-device=android] #device::before{
  content:'';position:absolute;left:-4px;top:16%;width:4px;height:6%;border-radius:3px 0 0 3px;background:#23242b;box-shadow:0 56px 0 #23242b,0 -44px 0 -1px #23242b}
body:not(.native)[data-device=iphone] #device::after,body:not(.native)[data-device=android] #device::after{
  content:'';position:absolute;right:-4px;top:24%;width:4px;height:10%;border-radius:0 3px 3px 0;background:#23242b}
.app{--sat:0px;--sab:0px;--bezel-r:0px;position:absolute;inset:var(--bezel,0);border-radius:inherit;overflow:hidden;display:flex;isolation:isolate;
  background:var(--noise),var(--app-bg);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);color:var(--text)}
body:not(.native)[data-device=iphone] .app{--sat:54px;--sab:26px;border-radius:calc(var(--dev-r) - var(--bezel));background-color:var(--solid-bg)}
body:not(.native)[data-device=android] .app{--sat:38px;--sab:16px;border-radius:calc(var(--dev-r) - var(--bezel));background-color:var(--solid-bg)}
body.native .app{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);border-radius:0}
body[data-device=desktop] .app{border-radius:26px}
.hw{position:absolute;inset:0;pointer-events:none;z-index:5;display:none}
body:not(.native)[data-device=iphone] .hw,body:not(.native)[data-device=android] .hw{display:block}
.hw i{position:absolute;display:none}
body[data-device=iphone] .isl{display:block;top:20px;left:50%;width:112px;height:33px;margin-left:-56px;border-radius:20px;background:#000;box-shadow:0 0 0 1px #15151a}
body[data-device=android] .punch{display:block;top:19px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#000;box-shadow:0 0 0 3px #0b0b0f,inset 0 0 3px 1px #1b2a44}
.home{display:block!important;bottom:18px;left:50%;width:122px;height:5px;margin-left:-61px;border-radius:5px;background:var(--text);opacity:.7}
body[data-device=android] .home{width:90px;bottom:10px}
.statusbar{display:none;position:absolute;top:0;left:0;right:0;height:var(--sat);z-index:95;pointer-events:none;direction:ltr;align-items:flex-end;justify-content:space-between;padding:0 30px 8px;font-size:14px;font-weight:700;color:var(--text)}
body:not(.native)[data-device=iphone] .statusbar,body:not(.native)[data-device=android] .statusbar{display:flex}
body[data-device=android] .statusbar{padding:0 22px 8px;font-size:13px;font-weight:600}
.sb-r{display:flex;gap:5px;align-items:center}
.sb-r svg{height:12px;width:auto;fill:currentColor}
/* ============ RAIL ============ */
.rail{width:80px;flex:none;display:flex;flex-direction:column;align-items:center;padding:20px 0;gap:14px;border-inline-end:1px solid var(--line);position:relative;z-index:2}
.mob .rail{display:none}
.logo{width:48px;height:48px;border-radius:17px;background:var(--grad);display:grid;place-items:center;color:var(--on-grad);box-shadow:var(--glow);transition:transform .5s var(--spring)}
.logo:hover{transform:rotate(-8deg) scale(1.08)}
.rail-tabs{position:relative;display:flex;flex-direction:column;gap:8px;margin-top:12px}
.rail-bot{margin-top:auto}
.rt{width:52px;height:52px;border-radius:18px;display:grid;place-items:center;color:var(--dim);position:relative;z-index:1;transition:color .3s,transform .4s var(--spring)}
.rt:hover{transform:scale(1.1);color:var(--text)}.rt:active{transform:scale(.9)}
.rt.on{color:var(--accent)}
.rail-ind{position:absolute;top:0;left:0;width:52px;height:52px;border-radius:18px;background:var(--panel-2);box-shadow:var(--sh-in);transition:transform .55s var(--spring)}
.nb{position:absolute;top:3px;inset-inline-end:3px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--danger);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;line-height:1;animation:dropIn .55s var(--spring)}
/* ============ LIST PANEL ============ */
.list-panel{position:relative;flex:none;width:384px;display:flex;flex-direction:column;overflow:hidden;border-inline-end:1px solid var(--line)}
.mob .list-panel{position:absolute;inset:0;width:auto;border:0;transition:transform .55s var(--ios),filter .55s}
.mob.chat-open .list-panel{transform:translateX(28%);filter:brightness(.6)}
.views{position:relative;flex:1;min-height:0}
.view{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;visibility:hidden;transform:translateY(16px) scale(.985);transition:opacity .3s,transform .55s var(--smooth),visibility 0s .3s}
.view.on{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.vhead{padding:calc(var(--sat) + 20px) 20px 8px;display:flex;align-items:center;justify-content:space-between;flex:none}
.desk .vhead{padding-top:22px}
.view[data-v=chats] .search{margin-top:calc(var(--sat) + 20px)}
.desk .view[data-v=chats] .search{margin-top:22px}
.vtitle{font-size:26px;font-weight:800;letter-spacing:-.3px}
.vsub{font-size:12.5px;color:var(--dim);margin-top:-2px}
.ib{width:42px;height:42px;border-radius:15px;display:grid;place-items:center;color:var(--dim);background:var(--panel-2);box-shadow:var(--sh-2);flex:none;transition:color .3s,transform .4s var(--spring),box-shadow .3s}
.ib:hover{color:var(--accent)}.ib:active{transform:scale(.86)}
.ib .i{width:21px;height:21px}
.search{margin:8px 18px 4px;height:48px;border-radius:17px;background:var(--panel-2);box-shadow:var(--sh-in);display:flex;align-items:center;gap:10px;padding:0 14px;color:var(--dim);flex:none;cursor:text;transition:box-shadow .3s,color .3s}
.search:focus-within{color:var(--accent);box-shadow:var(--sh-in),0 0 0 2px var(--accent),var(--glow)}
.search input{flex:1;min-width:0;font-size:15px;color:var(--text);user-select:text;-webkit-user-select:text}
.search input::placeholder{color:var(--dim)}
.clr{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--dim);color:var(--solid-bg);opacity:0;transform:scale(.3) rotate(-90deg);pointer-events:none;transition:opacity .2s,transform .4s var(--spring)}
.clr .i{width:14px;height:14px}
.search.has .clr{opacity:1;transform:none;pointer-events:auto}
.chips{display:flex;gap:8px;padding:10px 18px 6px;overflow-x:auto;scrollbar-width:none;flex:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:6px 15px;border-radius:999px;background:var(--panel-2);font-size:13px;color:var(--dim);white-space:nowrap;box-shadow:var(--sh-2);transition:background .3s,color .3s,transform .4s var(--spring),box-shadow .3s}
.chip:active{transform:scale(.92)}
.chip.on{background:var(--accent);color:var(--on-accent);box-shadow:var(--glow);font-weight:700}
.vscroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:6px 10px 16px}
.mob .vscroll{padding-bottom:calc(var(--sab) + 104px)}
/* avatar */
.av{position:relative;flex:none;width:var(--s,52px);height:var(--s,52px);border-radius:50%}
.av img{width:100%;height:100%;border-radius:50%;display:block;box-shadow:var(--sh-2)}
.av .dot{position:absolute;inset-inline-end:0;bottom:1px;width:14px;height:14px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--solid-bg);transform:scale(0);transition:transform .5s var(--spring)}
.av.on .dot{transform:scale(1)}
.av::before{content:'';position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--accent);opacity:0;pointer-events:none}
.av.typing::before{animation:halo 1.5s ease-out infinite}
.av.typing::after{content:'';position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--accent-2);opacity:0;animation:halo 1.5s .75s ease-out infinite}
@keyframes halo{0%{transform:scale(.92);opacity:.95}100%{transform:scale(1.42);opacity:0}}
/* chat item */
.ci{display:flex;gap:13px;align-items:center;padding:0 12px;height:76px;margin:2px 0;border-radius:22px;cursor:pointer;position:relative;transition:background .3s,box-shadow .3s,transform .4s var(--spring)}
.ci[hidden]{display:none!important}
@media (hover:hover){.ci:hover{background:var(--panel-2)}}
.ci:active{transform:scale(.97)}
.ci.on{background:var(--sel);box-shadow:var(--sel-sh)}
.ci.on::before{content:'';position:absolute;inset-inline-start:0;top:24px;bottom:24px;width:3px;border-radius:3px;background:var(--grad);box-shadow:var(--glow)}
.cb{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:5px}
.ci.nopv .row2{display:none}
.row1,.row2{display:flex;align-items:center;justify-content:space-between;gap:8px;height:22px}
.nm{font-weight:700;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.fl{display:flex;gap:4px;color:var(--dim);flex:none}.fl .i{width:14px;height:14px}
.tm{font-size:12px;color:var(--dim);flex:none}
.ci.unr .tm{color:var(--accent)}
.pv{font-size:13.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1;display:flex;align-items:center;gap:4px}
.pv>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv .i{width:16px;height:16px;flex:none}
.pv.ty{color:var(--accent)}
.pv b{font-weight:600;color:var(--text);opacity:.7;flex:none}
.bslot{flex:none;width:26px;height:26px;display:flex;align-items:center;justify-content:center;position:relative}
.bslot.goo{filter:url(#goo)}
.badge{position:relative;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--grad);color:var(--on-grad);font-size:12px;font-weight:800;display:grid;place-items:center;box-shadow:var(--glow)}
.ci.mute .badge{background:var(--dim);box-shadow:none;color:var(--solid-bg)}
.badge.pop{animation:dropIn .6s var(--spring)}
.badge.bump{animation:bump .5s var(--spring)}
.badge.drop{color:transparent;animation:dropOut .7s cubic-bezier(.5,0,.3,1) forwards}
.badge.drop::before,.badge.drop::after{content:'';position:absolute;width:9px;height:9px;border-radius:50%;background:var(--accent);left:50%;top:50%;margin:-4.5px;animation:splash .7s ease-out forwards}
.badge.drop::after{width:7px;height:7px;background:var(--accent-2);animation-name:splash2}
@keyframes dropIn{0%{transform:scale(0)}45%{transform:scale(1.35,.7)}70%{transform:scale(.85,1.2)}100%{transform:scale(1)}}
@keyframes bump{0%{transform:scale(1)}30%{transform:scale(1.4,.75)}60%{transform:scale(.85,1.25)}100%{transform:scale(1)}}
@keyframes dropOut{0%{transform:scale(1,1)}18%{transform:scale(1.35,.72)}40%{transform:scale(.78,1.4) translateY(-3px)}62%{transform:scale(1.2,.85) translateY(3px)}100%{transform:scale(.1) translateY(-8px)}}
@keyframes splash{0%{transform:translate(0,0) scale(.4)}100%{transform:translate(-13px,-15px) scale(1);opacity:0}}
@keyframes splash2{0%{transform:translate(0,0) scale(.4)}100%{transform:translate(14px,-9px) scale(1);opacity:0}}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;padding:50px 20px;color:var(--dim);text-align:center;animation:fadeUp .5s var(--smooth)}
.empty svg{width:76px;height:76px;opacity:.7}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}}
/* calls / contacts / settings */
.cl .sub{display:flex;align-items:center;gap:5px}
.cl .sub .i{width:15px;height:15px}
.c-in{color:var(--ok)}.c-out{color:var(--accent)}.c-miss{color:var(--danger)}
.cl .ib{background:transparent;box-shadow:none;color:var(--accent)}
.set-card{margin:10px 8px;padding:16px;border-radius:24px;background:var(--panel-2);box-shadow:var(--sh-2)}
.set-card h3{font-size:14px;color:var(--dim);font-weight:600;margin-bottom:12px}
.me-card{display:flex;align-items:center;gap:14px}
.me-card b{font-size:17px}
.theme-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tcard{border-radius:20px;padding:9px;text-align:start;background:var(--panel-2);box-shadow:var(--sh-2);transition:transform .45s var(--spring),box-shadow .3s}
.tcard:hover{transform:translateY(-3px)}.tcard:active{transform:scale(.95)}
.tcard.on{box-shadow:0 0 0 2px var(--accent),var(--glow)}
.tcard .pvb{height:58px;border-radius:14px;margin-bottom:8px;position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(128,128,128,.25)}
.tcard .pvb i{position:absolute;height:14px;border-radius:8px}
.tcard span{font-size:12.5px;font-weight:600;display:block;line-height:1.4}
.trow{display:flex;align-items:center;justify-content:space-between;padding:10px 2px;gap:12px}
.trow small{display:block;color:var(--dim);font-size:12px}
.switch{width:52px;height:30px;border-radius:15px;background:var(--panel-2);box-shadow:var(--sh-in);position:relative;flex:none;transition:background .3s}
.switch::after{content:'';position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:var(--dim);transition:transform .45s var(--spring),background .3s;box-shadow:var(--sh-2)}
.switch.on{background:var(--grad)}
.switch.on::after{background:#fff;transform:translateX(-22px)}
/* ============ BOTTOM NAV / FAB ============ */
.bnav{display:none;position:absolute;z-index:30;left:12px;right:12px;bottom:calc(var(--sab) + 10px);height:68px;border-radius:28px;padding:6px;background:var(--solid);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:var(--sh-1),0 0 0 1px var(--line);transition:transform .6s var(--ios)}
.mob .bnav{display:flex}
.mob.chat-open .bnav{transform:translateY(calc(100% + var(--sab) + 30px))}
.bn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:11px;color:var(--dim);position:relative;z-index:1;border-radius:22px;transition:color .3s}
.bn.on{color:var(--accent);font-weight:700}
.bn.on .i{animation:bounceI .55s var(--spring)}
.bn .nb{top:2px;inset-inline-end:calc(50% - 22px)}
@keyframes bounceI{0%{transform:translateY(0) scale(.7)}50%{transform:translateY(-5px) scale(1.2)}100%{transform:none}}
.bn-ind{position:absolute;top:6px;bottom:6px;left:0;border-radius:22px;background:var(--panel-2);box-shadow:var(--sh-in);transition:transform .55s var(--spring),width .4s}
.fab{position:absolute;z-index:31;left:18px;bottom:calc(var(--sab) + 92px);width:58px;height:58px;border-radius:21px;background:var(--grad);color:var(--on-grad);box-shadow:var(--glow),var(--sh-1);display:none;place-items:center;transition:transform .55s var(--spring),opacity .3s,border-radius .5s var(--spring)}
.mob .fab{display:grid}
.mob.chat-open .fab,.mob:not(.tab-chats) .fab{transform:scale(0) rotate(90deg);opacity:0;pointer-events:none}
.fab:hover{border-radius:50%}.fab:active{transform:scale(.88) rotate(90deg)}
.fab .i{width:26px;height:26px}
/* ============ CHAT PANEL ============ */
.chat-panel{flex:1;min-width:0;position:relative;display:flex;flex-direction:column;overflow:hidden;z-index:1}
.mob .chat-panel{position:absolute;inset:0;z-index:10;transform:translateX(-100%);visibility:hidden;transition:transform .55s var(--ios),visibility 0s .55s;background:var(--noise),var(--solid-bg);box-shadow:var(--sh-1)}
.mob.chat-open .chat-panel{transform:none;visibility:visible;transition-delay:0s}
.dragging .chat-panel,.dragging .list-panel{transition:none!important}
.chat-view{flex:1;min-height:0;display:flex;flex-direction:column}
.chat-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--dim);text-align:center}
.mob .chat-empty{display:none}
.chat-empty svg{width:150px;height:150px}
.chat-empty h2{color:var(--text);font-size:20px}
.chat-empty .orb{animation:floaty 5s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
.chat-empty .orb:nth-child(2){animation-delay:-1.6s}.chat-empty .orb:nth-child(3){animation-delay:-3.2s}
@keyframes floaty{50%{transform:translateY(-10px) scale(1.06)}}
.chat-head{display:flex;align-items:center;gap:12px;padding:calc(var(--sat) + 10px) 16px 10px;border-bottom:1px solid var(--line);flex:none;z-index:3;position:relative}
.desk .chat-head{padding-top:14px}
.back{display:none}.mob .back{display:grid}
.hinfo{flex:1;min-width:0;cursor:pointer;display:flex;flex-direction:column;justify-content:center}
.hinfo.nostat .hstat{display:none}
.hname{font-weight:800;font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hstat{position:relative;height:20px;font-size:12.5px;color:var(--dim);overflow:hidden}
.hstat>span{position:absolute;inset-inline-start:0;top:0;white-space:nowrap;transition:opacity .3s,transform .45s var(--spring)}
.hstat .s-on{color:var(--accent)}
.hstat .s-typing{color:var(--accent);opacity:0;transform:translateY(14px)}
.chat-head.typing .s-typing{opacity:1;transform:none}
.chat-head.typing .s-norm{opacity:0;transform:translateY(-14px)}
.td2{display:inline-flex;gap:3px;margin-inline-start:4px;vertical-align:middle}
.td2 i{width:4px;height:4px;border-radius:50%;background:var(--accent);animation:blink 1.2s infinite}
.td2 i:nth-child(2){animation-delay:.2s}.td2 i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
/* messages */
.msgs{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:12px 16px 8px;display:flex;flex-direction:column;
  background-image:radial-gradient(var(--dots) 1.2px,transparent 1.6px);background-size:26px 26px;position:relative}
.msgs::before{content:'';margin-top:auto}
.msg{display:flex;margin-top:10px;--tox:100%}
.msg.nf{margin-top:3px}
.msg.me{justify-content:flex-start}
.msg.them{justify-content:flex-end;--tox:0%}
.msg.enter .mw{animation:msgIn .6s var(--spring) both}
.msg.me.enter .mw{--fx:34px}.msg.them.enter .mw{--fx:-34px}
@keyframes msgIn{from{opacity:0;transform:translate(var(--fx),22px) scale(.45)}55%{opacity:1}to{opacity:1;transform:none}}
.msg.out{overflow:hidden;transition:height .4s var(--smooth),margin .4s var(--smooth),opacity .25s,transform .35s var(--smooth)!important;opacity:0;transform:scale(.8);height:0!important;margin-top:0}
.msg.flash .bubble{animation:flash 1s}
@keyframes flash{30%{box-shadow:0 0 0 3px var(--accent),var(--glow)}}
.mw{display:flex;flex-direction:column;max-width:min(76%,540px);transform-origin:var(--tox) 100%;position:relative}
.me .mw{align-items:flex-start}.them .mw{align-items:flex-end}
.bubble{position:relative;padding:8px 13px 6px;border-radius:21px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:flex-end;column-gap:12px;font-size:15px;line-height:1.8;
  word-break:break-word;box-shadow:var(--bub-sh);-webkit-touch-callout:none;transition:transform .4s var(--spring),box-shadow .3s}
.me .bubble{background:var(--out-bg);color:var(--out-text);border-end-start-radius:6px}
.them .bubble{background:var(--in-bg);color:var(--in-text);border:var(--in-border);border-end-end-radius:6px}
.me.nl .bubble{border-end-start-radius:9px}.me.nf .bubble{border-start-start-radius:9px}
.them.nl .bubble{border-end-end-radius:9px}.them.nf .bubble{border-start-end-radius:9px}
.msg.lift .bubble{transform:scale(1.045);box-shadow:var(--glow),var(--sh-1)}
.msgs.ctxing .msg:not(.lift){opacity:.4;transition:opacity .3s}
.txt{white-space:pre-wrap;min-width:0;flex:0 1 auto}
.meta{flex:none;display:flex;align-items:center;gap:4px;font-size:11px;opacity:.72;margin-inline-start:auto;height:18px;padding-top:3px;font-variant-numeric:tabular-nums}
.tk{display:grid;place-items:center;opacity:.7;transition:opacity .3s,transform .5s var(--spring)}
.tk .i{width:16px;height:16px}
.tk[data-s=read]{opacity:1;animation:bump .5s var(--spring)}
.quote{flex:1 0 100%;border-inline-start:3px solid currentColor;padding:1px 9px;margin:2px 0 6px;border-radius:6px;background:rgba(127,127,127,.16);font-size:12.5px;line-height:1.6;cursor:pointer;min-width:0}
.quote b{display:block;font-size:12px;opacity:.9}
.quote span{display:block;opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.reacts{display:flex;gap:4px;margin-top:-7px;padding:0 9px;position:relative;z-index:1;flex-wrap:wrap}
.reacts:empty{display:none}
.rc{display:flex;align-items:center;gap:3px;padding:1px 8px;border-radius:999px;font-size:14px;background:var(--solid-bg);box-shadow:0 0 0 1px var(--line),var(--sh-2);cursor:pointer;transition:transform .3s var(--spring)}
.rc.new{animation:rcpop .6s var(--spring)}
.rc:active{transform:scale(.85)}
.rc.mine{box-shadow:0 0 0 1.5px var(--accent),var(--sh-2)}
.rc b{font-size:11px;font-weight:700;color:var(--dim)}
@keyframes rcpop{0%{transform:scale(0) translateY(-10px)}55%{transform:scale(1.4) rotate(-8deg)}100%{transform:none}}
.dsep{align-self:center;margin:16px 0 6px;padding:3px 15px;border-radius:999px;background:var(--panel-2);color:var(--dim);font-size:12px;box-shadow:var(--sh-2)}
/* voice */
.voice{display:flex;align-items:center;gap:11px;flex:1 0 100%;padding:3px 0 1px}
.vplay{width:42px;height:42px;border-radius:50%;flex:none;position:relative;background:rgba(255,255,255,.22);display:grid;place-items:center;transition:transform .4s var(--spring)}
.them .vplay{background:var(--accent);color:var(--on-accent);box-shadow:var(--glow)}
.vplay:active{transform:scale(.86)}
.vplay .i{position:absolute;width:18px;height:18px;transition:transform .45s var(--spring),opacity .2s}
.vplay .pa{opacity:0;transform:scale(.3) rotate(-70deg)}
.playing .vplay .pa{opacity:1;transform:none}
.playing .vplay .pl{opacity:0;transform:scale(.3) rotate(70deg)}
.vwrap{display:flex;flex-direction:column;gap:1px}
.voice canvas{width:148px;height:30px;display:block;cursor:pointer}
.vdur{font-size:11px;opacity:.8;font-variant-numeric:tabular-nums}
/* image */
.bubble.pic{padding:4px;display:block}
.pic img{width:250px;max-width:100%;height:auto;aspect-ratio:4/3;object-fit:cover;max-height:430px;border-radius:17px;display:block;cursor:zoom-in;background:var(--panel-2)}
.pic .cap{padding:6px 9px 0;display:flex;flex-wrap:wrap;align-items:flex-end}
.pic:not(.hascap) .meta{position:absolute;inset-inline-end:11px;bottom:10px;background:rgba(0,0,0,.5);color:#fff;padding:0 8px;border-radius:10px;opacity:1}
.pic.hascap .meta{padding:0 4px 4px}
/* file card */
.bubble.fl{padding:10px 12px 6px;display:block}
.fcard{display:flex;align-items:center;gap:11px;min-width:210px;max-width:270px;cursor:pointer}
.fcard .fi2{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;background:rgba(128,128,128,.22)}
.fcard .fi2 svg{width:22px;height:22px}
.fcard .fn{display:flex;flex-direction:column;min-width:0;flex:1;text-align:start}
.fcard b{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;unicode-bidi:plaintext;text-align:start}
.fcard small{font-size:11.5px;opacity:.75}
.bubble.fl .meta{display:flex;justify-content:flex-end;margin-top:2px}
.pic img[data-fid]{object-fit:cover}
/* typing bubble */
.bubble.tb{padding:13px 16px}
.goo{display:flex;gap:5px;filter:url(#goo);padding:2px}
.goo i{width:10px;height:10px;border-radius:50%;background:var(--dim);animation:liquid 1.3s infinite ease-in-out}
.goo i:nth-child(2){animation-delay:.16s}.goo i:nth-child(3){animation-delay:.32s}
.them .goo i{background:var(--accent)}
@keyframes liquid{0%,60%,100%{transform:translateY(0) scale(1,1)}25%{transform:translateY(-8px) scale(.82,1.25)}45%{transform:translateY(1px) scale(1.3,.78)}}
/* reply strip + composer */
.rstrip{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s var(--smooth);flex:none}

const artCache={};
function art(seed,w=480,h=360){
  const k=seed+'_'+w+'_'+h;if(artCache[k])return artCache[k];
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;const x=cv.getContext('2d');const r=rng(seed*7919+13);const hue=r()*360;
  const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,`hsl(${hue} 65% 20%)`);g.addColorStop(.6,`hsl(${(hue+40)%360} 80% 52%)`);g.addColorStop(1,`hsl(${(hue+75)%360} 90% 70%)`);
  x.fillStyle=g;x.fillRect(0,0,w,h);
  x.fillStyle='#fff';for(let i=0;i<40;i++){x.globalAlpha=r()*.7;x.beginPath();x.arc(r()*w,r()*h*.5,r()*1.4+.3,0,7);x.fill()}x.globalAlpha=1;
  const sx=w*(.2+r()*.6),sy=h*(.32+r()*.2),sr=h*(.09+r()*.06);const rg=x.createRadialGradient(sx,sy,0,sx,sy,sr*3);rg.addColorStop(0,'rgba(255,255,230,.95)');rg.addColorStop(.25,'rgba(255,230,170,.5)');rg.addColorStop(1,'rgba(255,200,150,0)');
  x.fillStyle=rg;x.fillRect(0,0,w,h);x.fillStyle='#fffbe8';x.beginPath();x.arc(sx,sy,sr,0,7);x.fill();
  for(let l=0;l<4;l++){const base=h*(.52+l*.13),amp=h*(.12-l*.02),f1=2+r()*3,f2=5+r()*5,ph=r()*9;
    x.fillStyle=`hsl(${(hue+50+l*12)%360} ${45-l*6}% ${26-l*6}%)`;x.beginPath();x.moveTo(0,h);
    for(let i=0;i<=w;i+=6){const t=i/w;x.lineTo(i,base-amp*(Math.sin(t*f1*3+ph)*.6+Math.sin(t*f2*3+ph*2)*.4+.6))}
    x.lineTo(w,h);x.closePath();x.fill()}
  return artCache[k]=cv.toDataURL('image/jpeg',.82);
}

const Snd=(()=>{let ctx=null,master=null,noise=null;
  const init=()=>{if(ctx)return ctx;try{const A=window.AudioContext||window.webkitAudioContext;ctx=new A();master=ctx.createGain();master.gain.value=.55;master.connect(ctx.destination);
    noise=ctx.createBuffer(1,ctx.sampleRate*.6,ctx.sampleRate);const d=noise.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}catch(e){ctx=null}return ctx};
  const on=()=>S.sound&&init()&&(ctx.state==='suspended'&&ctx.resume(),true);
  const tone=(f,f2,t,v,at=0,type='sine')=>{const n=ctx.currentTime+at;const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(f,n);
    if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+t);g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(v,n+.012);g.gain.exponentialRampToValueAtTime(.0001,n+t);o.connect(g);g.connect(master);o.start(n);o.stop(n+t+.03)};
  return{unlock(){if(S.sound&&init()&&ctx.state==='suspended')ctx.resume()},
    send(){if(!on())return;tone(300,760,.09,.3);tone(760,420,.12,.12,.03)},
    recv(){if(!on())return;tone(784,0,.5,.16,0,'triangle');tone(1175,0,.6,.13,.09,'triangle');tone(1568,0,.5,.05,.18)},
    click(){if(!on())return;tone(1700,1100,.035,.09,0,'triangle')},
    react(){if(!on())return;tone(660,1320,.1,.2);tone(1760,0,.16,.1,.06)},
    rec(up){if(!on())return;up?(tone(500,0,.08,.15),tone(800,0,.1,.15,.08)):(tone(800,0,.08,.15),tone(480,0,.12,.15,.08))},
    ring(){if(!on())return;for(let i=0;i<2;i++){tone(440,0,.35,.09,i*.9);tone(480,0,.35,.09,i*.9)}},
    swoosh(){if(!on())return;const n=ctx.currentTime;const s=ctx.createBufferSource();s.buffer=noise;const f=ctx.createBiquadFilter();f.type='bandpass';f.Q.value=2.5;
      f.frequency.setValueAtTime(300,n);f.frequency.exponentialRampToValueAtTime(3500,n+.4);const g=ctx.createGain();g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(.25,n+.15);g.gain.exponentialRampToValueAtTime(.0001,n+.5);
      s.connect(f);f.connect(g);g.connect(master);s.start(n);s.stop(n+.55)}}})();

function updateList(){

  let shown=0;
  order.forEach(c=>{const el=itemEls.get(c.id);const ok=matches(c,q)&&passF(c);el.hidden=!ok;updateItem(c,q);if(ok)shown++});
  let prev=null;
  order.forEach(c=>{const el=itemEls.get(c.id);const exp=prev?prev.nextElementSibling:clist.firstElementChild;if(exp!==el)clist.insertBefore(el,exp);prev=el});

  order.forEach(c=>{const el=itemEls.get(c.id);if(el.hidden)return;const nt=el.getBoundingClientRect().top,ot=before.get(c.id);

  syncNav();
}

let remote=null,remoteSeq=0,remoteTimer=0;

function findRemote(){
  clearTimeout(remoteTimer);const my=++remoteSeq,q=S.q.trim().replace(/^@/,'');
  if(!UNAME.test(q)||q.toLowerCase()===ME_USER.toLowerCase()||CONTACTS.some(c=>c.user&&c.user.replace('@','').toLowerCase()===q.toLowerCase()))return hideRemote();
  remoteTimer=setTimeout(async()=>{
    let u=null;const nob={id:'p_'+q.toLowerCase(),name:q,username:q};
    try{const r=await fetch(SB_URL+'/rest/v1/mowj_users?select=id,name,username&limit=1&username=ilike.'+encodeURIComponent(q.replace(/_/g,'\\_')),{headers:{'apikey':SB_KEY}});if(my!==remoteSeq)return;
      if(r.ok){const d=await r.json();const row=Array.isArray(d)?d.find(x=>x&&String(x.username).toLowerCase()===q.toLowerCase()):null;u=row||null}
      else u=null}
    catch(e){u=null}
    if(my!==remoteSeq)return;if(!u)return hideRemote();
    const c=mkRemote(u);remote=u;
    userRes.innerHTML=`${avHTML(c,54)}<div class="cb"><div class="row1"><span class="nm">${esc(u.name)}</span></div><div class="row2"><div class="pv"><span dir="ltr">@${esc(u.username)}</span></div></div></div>`;

  },350)}

async function cropAv(f){
  const d=await decodeImg(f);

    const mk2=(n,q)=>{const cv=document.createElement('canvas');cv.width=cv.height=n;const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,n,n);x.imageSmoothingQuality='high';x.drawImage(d.im,sx,sy,sq,sq,0,0,n,n);return cv.toDataURL('image/jpeg',q)};
    return{l:mk2(256,.88),s:mk2(96,.72)}}
  finally{URL.revokeObjectURL(d.u)}}

function msgRow(m){
  const c=cur(),row=document.createElement('div');row.className='msg '+m.from;row.dataset.id=m.id;row.dataset.from=m.from;

  else if(m.type==='voice')b=`${quote}<div class="voice"><button class="vplay" aria-label="پخش">${ic('play','pl')}${ic('pause','pa')}</button><div class="vwrap"><canvas></canvas><span class="vdur">${fmtDur(m.dur)}</span></div></div>${meta}`;

  row.innerHTML=`<div class="mw"><div class="bubble ${cls}">${b}</div><div class="reacts">${reactsHTML(m)}</div></div>`;

function endCall(reason,notify){

    setTimeout(()=>{try{cl.ctrl.close()}catch(e){}},500)}
  try{cl.mc&&cl.mc.close()}catch(e){}
  try{cl.local&&cl.local.getTracks().forEach(t=>t.stop())}catch(e){}
  const dur=cl.startedAt?Math.round((Date.now()-cl.startedAt)/1000):0;
  if(!cl.demo){
    if(cl.dir==='in')logCall(cl.peer,cl.startedAt?'in':'miss',dur?durTxt(dur):'');
    else logCall(cl.peer,'out',dur?durTxt(dur):'')}
  const msgs={noanswer:'پاسخ نداد',rejected:'تماس رد شد',fail:'اتصال برقرار نشد',mic:'دسترسی به میکروفون ممکن نیست',busy:'مشغول است',error:'خطا در تماس',offline:'کاربر آنلاین نیست (برنامه را باز ندارد)'};
  if(msgs[reason])toast(msgs[reason]);
  callSt(dur?'تماس پایان یافت · '+durTxt(dur):'تماس پایان یافت');
  setTimeout(()=>{if(CALL)return;callEl.classList.remove('on');setTimeout(()=>{if(!CALL){callEl.innerHTML='';callEl.className='call'}},450)},dur||reason?650:150)}
function onConnected(){
  const cl=CALL;if(!cl||cl.state==='active')return;
  cl.state='active';cl.startedAt=Date.now();clearTimeout(cl.noAns);clearTimeout(cl.openT);clearInterval(cl.ringI);
  if(cl.video)callEl.classList.add('live-v');

  mc.on('close',()=>{if(CALL===cl&&!cl.closing)endCall(cl.state==='active'?'':'fail',false)});
  mc.on('error',()=>{if(CALL===cl)endCall('error',true)});

function onCtrl(conn,d){
  if(!d||typeof d!=='object')return;

    const un=String(d.username||'').replace(/[^A-Za-z0-9_]/g,'').slice(0,20);

    const c=contactFor({uid:d.uid,name:d.name,username:un});
    const cl=CALL=newCall(c,'in',d.video);cl.ctrl=conn;cl.pid=pidOf(un);
    renderCall();callSt(cl.video?'تماس تصویری ورودی…':'تماس ورودی…');ringLoop(cl);

function onCtrlClose(conn){const cl=CALL;if(cl&&cl.ctrl===conn&&!cl.closing)endCall(cl.state==='incoming'?'miss':cl.state==='active'?'':'fail',false)}
function initPeer(){
  if(PEER||!ME_USER||typeof Peer==='undefined')return;
  try{PEER=new Peer(pidOf(ME_USER),{config:ICE_CFG,debug:0})}catch(e){PEER=null;return}
  const pr=PEER;
  pr.on('open',()=>{peerReady=true;idTry=0});
  pr.on('close',()=>{if(PEER===pr){PEER=null;peerReady=false;setTimeout(initPeer,3000)}});
  pr.on('disconnected',()=>{peerReady=false;const rt=()=>{if(PEER!==pr||pr.destroyed||!pr.disconnected)return;try{pr.reconnect()}catch(e){}setTimeout(rt,5000)};setTimeout(rt,2000)});
  pr.on('error',e=>{
    if(e.type==='peer-unavailable'){if(CALL&&CALL.dir==='out'&&CALL.state==='calling'&&!CALL.demo&&!CALL.opened)endCall('offline',false)}

    if(cl&&cl.dir==='in'&&cl.state==='connecting'&&cl.local&&mc.peer===cl.pid){cl.mc=mc;bindMC(cl,mc);mc.answer(cl.local)}
    else{try{mc.close()}catch(e){}}})}

    const cl=CALL=newCall(c,'out',video);cl.demo=true;renderCall();callSt('در حال برقراری تماس…');ringLoop(cl);
    toast('این مخاطب نمونه است؛ تماس واقعی فقط با کاربران ثبت‌شده (جستجوی نام کاربری)');
    cl.noAns=setTimeout(()=>{if(CALL===cl)onConnected()},2400);return}

    attachLocal(cl);callSt('در حال زنگ‌زدن…');ringLoop(cl);

    conn.on('open',()=>{cl.opened=true;clearTimeout(cl.openT);conn.send({t:'invite',video:cl.video,name:ME_NAME,username:ME_USER,uid:ME_ID||undefined})});

  else if(b.id==='acc')acceptCall();
  else if(b.id==='mute'){CALL.muted=!CALL.muted;CALL.local&&CALL.local.getAudioTracks().forEach(t=>t.enabled=!CALL.muted);renderBar()}
  else if(b.id==='cam'){CALL.camOff=!CALL.camOff;CALL.local&&CALL.local.getVideoTracks().forEach(t=>t.enabled=!CALL.camOff);renderBar()}});
$('#callBtn').addEventListener('click',()=>startCall(cur(),false));
/* ================= پیام واقعی (متن/ویس/عکس/فایل) روی کانال داده‌ی PeerJS ================= */
const SEEN=new Set((function(){try{const a=JSON.parse(localStorage.getItem('mowj.seen')||'[]');return Array.isArray(a)?a:[]}catch(e){return[]}})()),NET_MAX=12*1048576;
const cleanUn=s=>String(s||'').replace(/[^A-Za-z0-9_]/g,'').slice(0,20);
function netSend(c,m){if(m.type==='text'&&cleanUn(c.user)){sbSend(c,m);return}(c._out=c._out||[]).push(m);flushOut(c)}
/* ===== پیام متنی از طریق Supabase (حتی اگر طرف مقابل آنلاین نباشد می‌رسد) ===== */
const SB_LAST_KEY='mowj.sbLast.'+String(ME_USER).toLowerCase();
let sbLast=+(localStorage.getItem(SB_LAST_KEY)||0)||0,sbBusy=false,sbQ=[];
async function sbPost(c,m){
  const r=await fetch(SB_URL+'/rest/v1/mowj_messages',{method:'POST',headers:{'Content-Type':'application/json','apikey':SB_KEY,'Prefer':'return=minimal'},
    body:JSON.stringify({mid:m.mid,from_user:ME_USER,from_name:ME_NAME,to_user:cleanUn(c.user).toLowerCase(),body:String(m.text||'').slice(0,4000)})});
  if(r.ok||r.status===409)return true;
  throw new Error('http '+r.status)}
async function sbSend(c,m){
  try{await sbPost(c,m);setTicks(m,'sent');updateList()}
  catch(e){sbQ.push([c,m]);if(!c._sbWarn){c._sbWarn=1;toast('اتصال برقرار نیست؛ پیام بعداً فرستاده می‌شود')}}}
async function sbRetry(){
  if(!sbQ.length)return;const q=sbQ;sbQ=[];
  for(const [c,m] of q){try{await sbPost(c,m);setTicks(m,'sent');c._sbWarn=0}catch(e){sbQ.push([c,m])}}
  updateList()}
async function sbPoll(){
  if(sbBusy||!ME_USER||document.hidden)return;sbBusy=true;
  try{
    const r=await fetch(SB_URL+'/rest/v1/mowj_messages?select=id,mid,from_user,from_name,body&order=id.asc&limit=100&to_user=eq.'+encodeURIComponent(String(ME_USER).toLowerCase())+'&id=gt.'+sbLast,{headers:{'apikey':SB_KEY}});
    if(!r.ok)return;const rows=await r.json();
    if(!Array.isArray(rows))return;
    for(const x of rows){
      sbLast=Math.max(sbLast,+x.id||0);
      const un=cleanUn(x.from_user);if(!un||!x.mid||SEEN.has(x.mid))continue;
      SEEN.add(x.mid);
      const c=contactFor({name:x.from_name||un,username:un});
      const t=String(x.body||'').slice(0,4000);if(t)deliver(c,t)}
    try{localStorage.setItem(SB_LAST_KEY,String(sbLast));localStorage.setItem('mowj.seen',JSON.stringify([...SEEN].slice(-1000)))}catch(e){}
    if(rows.length>=100)setTimeout(sbPoll,50)
  }catch(e){}finally{sbBusy=false}}
setInterval(sbPoll,2500);setInterval(sbRetry,6000);sbPoll();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)sbPoll()});
function chatConn(c){
  if(c._ch&&c._ch.open)return c._ch;
  if(c._chPending||!PEER||!peerReady)return null;
  const conn=PEER.connect(pidOf(c.user),{reliable:true,label:'chat'});c._chPending=conn;
  const drop=()=>{if(c._chPending===conn)c._chPending=null;if(c._ch===conn)c._ch=null};
  conn.on('open',()=>{c._chPending=null;c._ch=conn;conn.on('data',d=>onChatData(conn,d));flushOut(c)});
  conn.on('close',drop);conn.on('error',drop);
  setTimeout(()=>{if(c._chPending===conn){c._chPending=null;try{conn.close()}catch(e){}
    if(c._out&&c._out.length&&!c._warned){c._warned=1;toast('«'+first(c)+'» آنلاین نیست؛ پیام بعداً فرستاده می‌شود')}}},8000);
  return null}
async function flushOut(c){
  const q=c._out;if(!q||!q.length||c._flushing)return;
  const ch=c._ch&&c._ch.open?c._ch:chatConn(c);if(!ch)return;
  c._flushing=true;c._out=[];c._warned=0;let failed=false;
  try{
    for(let i=0;i<q.length;i++){
      const m=q[i];
      try{
        if(!ch.open)throw new Error('closed');
        const x={type:m.type,text:m.text||'',dur:m.dur,wave:m.wave,w:m.w,h:m.h,name:m.name,size:m.size,mime:m.mime};
        if(m.fid){const b=BLOBS[m.fid]||await mdb.get(m.fid).catch(()=>null);
          if(b&&b.size<=NET_MAX){x.blob=await b.arrayBuffer();x.mime=x.mime||b.type}
          else{toast(b?'فایل بزرگ‌تر از ۱۲ مگابایت آنلاین ارسال نمی‌شود':'فایل در دسترس نیست');setTicks(m,'sent');continue}}
        ch.send({t:'msg',mid:m.mid,from:{name:ME_NAME,username:ME_USER,uid:ME_ID||undefined,av:ME_AV?ME_AV.s:''},m:x})
      }catch(e){failed=true;c._out=q.slice(i).concat(c._out||[]);break}
    }
  }finally{c._flushing=false}
  if(!failed&&c._out&&c._out.length)setTimeout(()=>flushOut(c),50);
}
function onChatData(conn,d){
  if(!d||typeof d!=='object')return;
  if(d.t==='msg'&&d.from&&d.m){
    const un=cleanUn(d.from.username);if(!un)return;
    const c=contactFor({uid:d.from.uid,name:d.from.name,username:un});
    if(d.from.av==='')setPeerAv(c,null);else if(AV_OK(d.from.av))setPeerAv(c,d.from.av);
    if(c._ch!==conn){c._ch=conn;conn.on('close',()=>{if(c._ch===conn)c._ch=null})}
    const seen=S.active===c.id&&!document.hidden;
    try{conn.send({t:'ack',mid:d.mid,read:seen})}catch(e){}
    if(SEEN.has(d.mid))return;SEEN.add(d.mid);
    const x=d.m,type=['text','voice','img','file'].includes(x.type)?x.type:'text';
    if(type==='text'){const t=String(x.text||'').slice(0,4000);if(t)deliver(c,t);return}
    const p={type};
    if(x.blob){const blob=new Blob([x.blob],{type:String(x.mime||'')});
      const fid=(type==='voice'?'v':'f')+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
      URLS[fid]=URL.createObjectURL(blob);BLOBS[fid]=blob;mdb.put(fid,blob).catch(()=>{});p.fid=fid;p.mime=blob.type;p.size=blob.size}
    else return;
    if(type==='voice'){p.dur=clamp(+x.dur||1,1,600);p.wave=Array.isArray(x.wave)&&x.wave.length===32?x.wave.map(v=>clamp(+v||.3,.1,1)):genWave(MID*7)}
    else if(type==='img'){p.w=+x.w||0;p.h=+x.h||0;p.cap=String(x.text||'').slice(0,1000)}
    else{p.name=String(x.name||'file').slice(0,120)}
    deliver(c,p);return}
  const c=CONTACTS.find(z=>z._ch===conn);
  if(d.t==='ack'){for(const z of CONTACTS){const m=z.msgs.find(y=>y.mid===d.mid);if(m){setTicks(m,d.read?'read':'sent');updateList();break}}}
  else if(d.t==='read'&&c){c.msgs.forEach(m=>{if(m.from==='me'&&m.status!=='read')setTicks(m,'read')});updateList()}}
setInterval(()=>CONTACTS.forEach(c=>{if(c._out&&c._out.length)flushOut(c)}),6000);
initPeer();
const netUp=()=>{if(!PEER)initPeer();else if(PEER.disconnected&&!PEER.destroyed)try{PEER.reconnect()}catch(e){}};
addEventListener('online',netUp);document.addEventListener('visibilitychange',()=>{if(!document.hidden)netUp()});

/* ================= bot: replies, typing, live messages ================= */
const RULES=[
 [/سلام|درود|hi\b|hello/i,['سلام! خوش اومدی 😊','درود بر تو! چه خبر؟','سلام سلام ☀️ حالت چطوره؟']],
 [/خوبی|حالت|چطوری|احوال/,['عالیم! تو چطوری؟','خدا رو شکر، بدک نیستم. تو چی؟','مثل همیشه سرحال 😎']],
 [/مرسی|ممنون|تشکر/,['خواهش می‌کنم عزیزم 🌷','قابلی نداشت!','همیشه در خدمتم 🙌']],
 [/خداحافظ|فعلا|فعلاً|بای|شب بخیر/,['فعلاً! مراقب خودت باش 👋','شب خوش ✨','به زودی می‌بینمت!']],
 [/دوستت|❤|عاشق/,['منم دوستت دارم! ❤️','وای چه شیرین 🥰']],
 [/فردا|امروز|ساعت|قرار|جلسه/,['فردا عصر خوبه؟ ساعت ۵ می‌تونم','قرارمون سر جاشه، یادم نرفته 📅','ساعتش رو تو بگو، من هماهنگ می‌کنم']],
 [/کار|پروژه|طراحی|کد/,['پروژه داره خوب پیش میره 💪','بذار یه نگاه بندازم و بهت خبر بدم','فکر کنم تا آخر هفته تموم بشه']],
 [/😂|هه|خنده|جوک/,['😂😂 خیلی خوب بود','هاهاها دقیقاً!','دلم درد گرفت از خنده 🤣']],
 [/\[voice\]/,['پیام صوتی‌ات رو شنیدم 🎧 عالی بود!','صداتو دوست دارم 😄 الان جواب میدم']],
 [/\[img\]/,['وای چه عکس قشنگی! 😍','محشره! کجاست؟ 📸','عالیه، نور فوق‌العاده‌ای داره ✨']],
 [/[؟?]/,['سوال خوبیه، بذار یه لحظه فکر کنم…','به نظرم آره، ولی بیا بیشتر حرف بزنیم','هنوز مطمئن نیستم، تو چی فکر می‌کنی؟']]
];
function pickReplies(c,text){
  const t=norm(text);const out=[];
  for(const [re,arr] of RULES){if(re.test(t)||re.test(text)){out.push(pick(arr));break}}
  if(!out.length)out.push(Math.random()<.6?pick(c.pool):pick(GENERIC));
  if(Math.random()<.28)out.push(pick(c.pool));
  return out.filter((v,i,a)=>a.indexOf(v)===i);
}
function setTyping(c,on){
  if(c.typing===on)return;c.typing=on;
  if(S.active===c.id){renderHeadTyping(c);on?showTyping(c):removeTyping()}
  const el=itemEls.get(c.id);if(el)updateItem(c,norm(S.q.trim()));
}
function renderHeadTyping(c){chatHead.classList.toggle('typing',c.typing);$('#hAv').classList.toggle('typing',c.typing)}
function deliver(c,payload){
  const m=typeof payload==='string'?mk('them','text',payload,0):mk('them',payload.type,null,0,payload);
  m.status='read';c.msgs.push(m);
  const seen=S.active===c.id&&!document.hidden;
  if(S.active===c.id)appendMsg(c,m);
  if(!seen){c.unread++;if(!c.muted)banner(c,m)}
  if(!c.muted||seen)Snd.recv();
  updateList();
}
function banner(c,m){
  if(S.active===c.id&&!document.hidden)return;
  const b=document.createElement('div');b.className='banner';b.innerHTML=`${avHTML(c,42)}<div><b>${esc(c.name)}</b><span>${snipH(m,esc)}</span></div>`;
  $('#banners').appendChild(b);
  const kill=()=>{b.classList.add('bye');setTimeout(()=>b.remove(),420)};
  b.addEventListener('click',()=>{kill();setTab('chats',true);openChat(c.id)});
  setTimeout(kill,3800);
  const all=$$('.banner:not(.bye)');if(all.length>2)all[0].remove();
}
function scheduleReply(c,text){
  if(c.self||c.rid)return;
  if(c._busy){c._again=text;return}
  c._busy=true;
  clearTimeout(c._t);
  c._t=setTimeout(()=>{
    c.msgs.forEach(m=>{if(m.from==='me'&&m.status!=='read')m.status='read'});
    if(S.active===c.id)$$('.msg.me .tk',msgs).forEach(t=>{if(t.dataset.s!=='read'){t.dataset.s='read';t.innerHTML=tickIcon('read')}});
    updateList();
    const replies=pickReplies(c,text);let i=0;
    const next=()=>{
      if(i>=replies.length){setTyping(c,false);c._busy=false;if(c._again){const t=c._again;c._again=null;scheduleReply(c,t)}return}
      const r=replies[i++];setTyping(c,true);
      setTimeout(()=>{setTyping(c,false);
        if(/شنیدم|صدا/.test(r)&&Math.random()<.0){}
        deliver(c,r);
        if(i===1&&Math.random()<.3){const mine=[...c.msgs].reverse().find(x=>x.from==='me');if(mine&&S.active===c.id)setTimeout(()=>toggleReact(c,mine,pick(['❤️','👍','😂','🔥']),'them'),500)}
        if(i<replies.length)setTimeout(next,450+Math.random()*500);else next();
      },Math.min(3200,1000+r.length*48+Math.random()*500));
    };
    next();
  },700+Math.random()*900);
}
setInterval(()=>{
  if(!S.sim||S.rec)return;const cand=CONTACTS.filter(c=>!c.self&&!c.rid&&!c.typing&&!c._busy&&c.unread<4&&(c.id!==S.active||Math.random()<.25));
  if(!cand.length||Math.random()<.35)return;const c=pick(cand);c._busy=true;
  setTyping(c,true);
  setTimeout(()=>{setTyping(c,false);c._busy=false;
    deliver(c,Math.random()<.12?{type:'voice',dur:6+((Math.random()*20)|0),wave:genWave((Math.random()*999)|0)}:pick(c.pool))},1600+Math.random()*1600);
},24000);

/* ================= swipe-to-back (mobile) ================= */
let sw=null;
chatPanel.addEventListener('pointerdown',e=>{
  if(S.mode!=='mob'||!S.mobOpen||S.drawer||e.pointerType==='mouse'&&e.button!==0)return;
  const r=chatPanel.getBoundingClientRect();
  if(!((r.right-e.clientX)<46||e.target.closest('.chat-head')))return;
  sw={x:e.clientX,y:e.clientY,id:e.pointerId,drag:false,w:r.width,t:performance.now(),p:0};
});
window.addEventListener('pointermove',e=>{
  if(!sw||e.pointerId!==sw.id)return;const dx=e.clientX-sw.x,dy=e.clientY-sw.y;
  if(!sw.drag){
    if(Math.abs(dy)>14&&Math.abs(dy)>Math.abs(dx)){sw=null;return}
    if(dx<-10&&Math.abs(dx)>Math.abs(dy)*1.2){sw.drag=true;app.classList.add('dragging');closeCtx()}else return;
  }
  sw.p=clamp(-dx/sw.w,0,1);
  chatPanel.style.transform=`translateX(${-sw.p*100}%)`;listPanel.style.transform=`translateX(${(1-sw.p)*28}%)`;listPanel.style.filter=`brightness(${.6+.4*sw.p})`;
},{passive:true});
const swEnd=e=>{
  if(!sw||(e.pointerId!==sw.id))return;const s=sw;sw=null;if(!s.drag)return;
  const v=s.p/Math.max(1,performance.now()-s.t);
  app.classList.remove('dragging');void chatPanel.offsetWidth;
  chatPanel.style.transform='';listPanel.style.transform='';listPanel.style.filter='';
  if(s.p>.32||v>.0012){Snd.click();closeChat()}
};
window.addEventListener('pointerup',swEnd);window.addEventListener('pointercancel',swEnd);

/* ذخیره‌ی پیام‌های فضای شخصی */
(function(){const me=CONTACTS[0];let last='';
  const flush=()=>{try{const j=JSON.stringify(me.msgs);if(j!==last){localStorage.setItem('mowj.saved',j);last=j}}catch(e){}};
  setInterval(flush,1200);addEventListener('pagehide',flush);document.addEventListener('visibilitychange',flush)})();
/* ذخیره‌ی گفتگوها */
(function(){let last='';
  const flush=()=>{try{const o={};CONTACTS.forEach(c=>{if(c.rid&&c.msgs.length)o[c.id]={u:c.unread|0,m:c.msgs.slice(-500)}});
    const j=JSON.stringify(o);if(j!==last){localStorage.setItem('mowj.chats',j);last=j}
    localStorage.setItem('mowj.seen',JSON.stringify([...SEEN].slice(-1000)))}catch(e){}};
  setInterval(flush,1500);addEventListener('pagehide',flush);document.addEventListener('visibilitychange',flush)})();

paintTheme();paintSound();moveSeg();setTab('chats',true);updateList();
body.dataset.device=S.device;
measure();
if(S.mode==='desk'&&!S.active)openChat(CONTACTS[0].id,{quiet:true});
requestAnimationFrame(()=>{moveInds();moveSeg()});
document.fonts&&document.fonts.ready&&document.fonts.ready.then(()=>{moveInds();moveSeg()});
};
